# Auto-deploy the SpeciesNet detection service to Cloud Run.
#
# Wired to a Cloud Build trigger in the louielabs-animal-cams project (console-
# created by the owner, like the wildwatch-site one): on push to `main` filtered
# to speciesnet-service/**, this tests, builds, and deploys the private
# `speciesnet-service` Cloud Run service that web/lib/speciesnetClient.ts calls.
#
# Security posture lives in the deploy flags: --no-allow-unauthenticated means
# Cloud Run IAM rejects every caller except identities holding roles/run.invoker
# (granted once, to the web backend's cloud-backend@ service account only).
# No shared secret exists anywhere in this pipeline.
#
# One-time setup (owner/Alan — see speciesnet-service/README.md for the exact
# commands): create the zero-role speciesnet-runner service account, deploy,
# grant run.invoker to cloud-backend@, create this trigger.

steps:
  # 0) Test gate: the pure parsing functions only — no torch, no weights, runs
  #    in seconds. (Running the actual model in CI would add ~500MB + minutes
  #    for no coverage the parsing tests don't already give.)
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eu
        pip install --quiet pytest flask 'Pillow>=10,<12'
        cd speciesnet-service
        python -m pytest tests -q

  # 1) Build the image (context = speciesnet-service/). The slow part is the
  #    model-weight bake (~500MB from Kaggle) + CPU torch install — expect
  #    5-10 min. That's normal, not a hang.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/speciesnet-service:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/speciesnet-service:latest'
      - 'speciesnet-service'

  # 2) Push both tags.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/speciesnet-service']

  # 3) Deploy — private, minimal, scale-to-zero.
  #    --min-instances=0 is the cost setting: idle costs nothing, but the first
  #    request after idle pays a ~40-60s cold start (the web backend times out
  #    at 20s and falls back to Gemini-only for that photo — never broken, just
  #    ungated). If cold-start fallbacks show up often in analyzedBy audits,
  #    flip to --min-instances=1: one always-warm instance buys consistent
  #    gating for the price of an idle 4Gi/2cpu instance.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'speciesnet-service'
      - '--image=gcr.io/$PROJECT_ID/speciesnet-service:$SHORT_SHA'
      - '--region=us-west1'
      - '--service-account=speciesnet-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--no-allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--concurrency=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--timeout=120'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/speciesnet-service:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/speciesnet-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
